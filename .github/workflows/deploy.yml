name: Build and Deploy

on:
  push:
    # main = the public app (/run/); beta = the pre-release test build (beta.stromapp.info)
    branches: [main, beta]
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npx vitest run

      - name: Get version info
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "version=latest" >> $GITHUB_OUTPUT
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: strom-build
          # The app, and the muted icons of Safari's own app (see the deploy jobs).
          path: |
            strom.html
            pwa/icons/*-muted.png

  # Type errors esbuild lets through; alongside the browser suite.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  # The browser suite against the very strom.html built above, in 4 parallel
  # shards (each with fewer workers than vCPUs: an overloaded runner flakes).
  # Not on a tag: a release tag is the commit main has just tested.
  e2e:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: strom-build

      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system libraries
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: E2E tests (shard ${{ matrix.shard }}/4)
        run: npx playwright test --shard=${{ matrix.shard }}/4

      - name: Flaky tests in the summary
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            if (!fs.existsSync("e2e-results.json")) process.exit(0);
            const r = JSON.parse(fs.readFileSync("e2e-results.json", "utf8"));
            const st = r.stats || {};
            const flaky = [];
            const walk = (suite, path) => {
              for (const s of suite.suites || []) walk(s, [...path, s.title]);
              for (const spec of suite.specs || []) {
                for (const t of spec.tests || []) if (t.status === "flaky") flaky.push([...path, spec.title].filter(Boolean).join(" › "));
              }
            };
            for (const s of r.suites || []) walk(s, [s.title]);
            const line = `Shard ${process.env.SHARD}/4: ${st.expected ?? 0} passed, ${st.flaky ?? 0} flaky, ${st.unexpected ?? 0} failed, ${Math.round((st.duration ?? 0) / 1000)} s`;
            let md = `### ${line}\n`;
            for (const f of flaky) { md += `- flaky: ${f}\n`; console.log(`::warning title=Flaky e2e test::${f}`); }
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md);
            console.log(line);
          '
        env:
          SHARD: ${{ matrix.shard }}

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  deploy-pwa:
    needs: [build, e2e, typecheck]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: strom-build

      - name: Push to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          git config --global user.email "deploy@stromapp.info"
          git config --global user.name "Deploy Bot"
          git clone https://oauth2:${GITLAB_TOKEN}@gitlab.com/acidek/strom-app-info.git deploy-repo
          cp strom.html deploy-repo/run/index.html
          cd deploy-repo
          # Stamp the service worker cache name with the shell hash: browsers
          # only offer a PWA update when sw.js bytes change, so without this
          # the in-app update banner never fires for anyone.
          HASH=$(sha256sum run/index.html | cut -c1-12)
          sed -i "s/const CACHE_NAME = 'strom-[^']*'/const CACHE_NAME = 'strom-${HASH}'/" run/sw.js
          # Stamp the app version too: the worker adds it to its background
          # shell revalidation (?v=...), which is how the server-side stats
          # learn the version mix of installed PWAs. The build writes the
          # version into the About span, so the artifact itself is the source.
          VERSION=$(grep -o 'id="about-version">[^<]*' run/index.html | cut -d'>' -f2)
          sed -i "s/const APP_VERSION = '[^']*'/const APP_VERSION = '${VERSION}'/" run/sw.js
          # Safari's own app (Add to Dock) apart from the one from Chrome: its
          # own manifest, name and muted icons; the app links it in Safari on a
          # computer (pwa.ts linkManifest). Made from manifest.json here.
          mkdir -p run/icons && cp ../pwa/icons/*-muted.png run/icons/
          jq '.name = "Strom (Safari)" | .short_name = "Strom (Safari)" | .icons |= map(.src |= sub("\\.png$"; "-muted.png"))' run/manifest.json > run/manifest-safari.json
          grep -q '"short_name": "Strom (Safari)"' run/manifest-safari.json || { echo "safari manifest not made"; exit 1; }
          for f in $(jq -r '.icons[].src' run/manifest-safari.json) icons/apple-touch-icon-muted.png; do test -f "run/$f" || { echo "missing run/$f"; exit 1; }; done
          git add run/index.html run/sw.js run/manifest-safari.json run/icons
          git diff --staged --quiet || git commit -m "Update PWA from GitHub build"
          git push origin main

  # Pre-release test build: push to the `beta` branch deploys to
  # https://beta.stromapp.info/run/ (branch `beta` of the web repo) only. The
  # public app (/run/ on main), the `latest` pre-release and the tagged
  # releases are untouched.
  deploy-beta:
    needs: [build, e2e, typecheck]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/beta'
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: strom-build

      - name: Push to GitLab (beta)
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          git config --global user.email "deploy@stromapp.info"
          git config --global user.name "Deploy Bot"
          git clone -b beta https://oauth2:${GITLAB_TOKEN}@gitlab.com/acidek/strom-app-info.git deploy-repo
          cp strom.html deploy-repo/run/index.html
          cd deploy-repo
          # Same stamps as deploy-pwa: cache name from the shell hash, app version.
          HASH=$(sha256sum run/index.html | cut -c1-12)
          sed -i "s/const CACHE_NAME = 'strom-[^']*'/const CACHE_NAME = 'strom-${HASH}'/" run/sw.js
          VERSION=$(grep -o 'id="about-version">[^<]*' run/index.html | cut -d'>' -f2)
          sed -i "s/const APP_VERSION = '[^']*'/const APP_VERSION = '${VERSION}'/" run/sw.js
          # Installed next to the public app, the beta must not look like it:
          # its own name on the device. Stamped here, so the web repo's files
          # (and a later beta -> main merge there) keep the public name.
          sed -i -E 's/^(  "name": )"[^"]*"/\1"Strom Beta"/; s/^(  "short_name": )"[^"]*"/\1"Strom Beta"/' run/manifest.json
          grep -q '"short_name": "Strom Beta"' run/manifest.json || { echo "manifest name not stamped"; exit 1; }
          # Safari's own app, as in deploy-pwa (from the stamped manifest).
          mkdir -p run/icons && cp ../pwa/icons/*-muted.png run/icons/
          jq '.name = "Strom Beta (Safari)" | .short_name = "Strom Beta (Safari)" | .icons |= map(.src |= sub("\\.png$"; "-muted.png"))' run/manifest.json > run/manifest-safari.json
          grep -q '"short_name": "Strom Beta (Safari)"' run/manifest-safari.json || { echo "safari manifest not made"; exit 1; }
          for f in $(jq -r '.icons[].src' run/manifest-safari.json) icons/apple-touch-icon-muted.png; do test -f "run/$f" || { echo "missing run/$f"; exit 1; }; done
          git add run/index.html run/sw.js run/manifest.json run/manifest-safari.json run/icons
          git diff --staged --quiet || git commit -m "Update beta PWA from GitHub build"
          git push origin beta

  release-latest:
    needs: [build, e2e, typecheck]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: strom-build

      - name: Update latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          body: |
            Automatic build from latest commit on main branch.

            **Download:** [strom.html](https://github.com/ACiDekCZ/strom/releases/download/latest/strom.html)

            For stable releases, see [tagged versions](https://github.com/ACiDekCZ/strom/releases).
          prerelease: true
          files: strom.html
          make_latest: false

  release-tagged:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: strom-build

      - name: Create tagged release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            ## Strom ${{ github.ref_name }}

            **Download:** [strom.html](https://github.com/ACiDekCZ/strom/releases/download/${{ github.ref_name }}/strom.html)

            Or use the [online version](https://stromapp.info/run/).
          files: strom.html
          make_latest: true
